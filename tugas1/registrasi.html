<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REGISTRASI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <pre>
        <header class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="src/logo.png" alt="Logo" width="60" class="d-inline-block align-text-top">
                <h1>learnify</h1>
                <p style="font-size: medium;">: Belajar Cerdas, Kuasai Dunia!</p>
            </a>
        </div>
        </header>
    </pre>

    <div class="card">
      <div class="card-header">
        <h5 class="card-title text-center">Tambahkan Pengguna Baru</h5>
      </div>
      <form>
        <div class="row mb-3">
          <label for="inputEmail3" class="col-sm-2 col-form-label fw-bold fs-6"
            >Email kampus</label
          >
          <div class="col-sm-10">
            <input
              type="email"
              placeholder="name@example.com"
              class="form-control"
              id="inputEmail3"
            />
          </div>
        </div>
        <div class="row mb-3">
          <label
            for="inputPassword3"
            class="col-sm-2 col-form-label fw-bold fs-6"
            >Nama Lengkap</label
          >
          <div class="col-sm-10">
            <input
              type="text"
              placeholder="Sesuai dengan KK"
              class="form-control"
              id="inputPassword3"
            />
          </div>
        </div>
        <div class="row mb-3">
          <label for="inputPassword3" class="col-sm-2 col-form-label fw-bold"
            >Password</label
          >
          <div class="col-sm-10">
            <input
              type="password"
              placeholder="Bernilai Unik"
              class="form-control"
              id="inputPassword3"
            />
          </div>
        </div>

        <fieldset class="row mb-3">
          <legend class="col-form-label col-sm-2 pt-0 fw-bold fs-6">
            Jenis Kelamin
          </legend>
          <div class="col-sm-10">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="gridRadios"
                id="gridRadios1"
                value="option1"
                checked
              />
              <label class="form-check-label" for="gridRadios1">
                Laki-lai
              </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="gridRadios"
                id="gridRadios2"
                value="option2"
              />
              <label class="form-check-label" for="gridRadios2">
                Perempuan
              </label>
            </div>
          </div>
        </fieldset>

        <div class="row mb-3">
          <label for="inputPassword3" class="col-sm-2 col-form-label fw-bold"
            >Fakultas</label
          >
          <div class="col-sm-10">
            <select class="form-select" aria-label="Default select example">
              <option selected>Fakultas</option>
              <option value="1">Fakultas Teknik Industtri</option>
              <option value="2">FTM</option>
              <option disabled>Fakultas</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <label for="inputPassword3" class="col-sm-2 col-form-label fw-bold"
            >Alamat Lengkap</label
          >
          <div class="col-sm-10">
            <textarea name="" id="" style="align-items: stretch"></textarea>
          </div>
        </div>

        <div class="row mb-3">
          <label for="inputPassword3" class="col-sm-2 col-form-label fw-bold"
            >Unit Kegiatan Mahasiswa</label
          >
          <div class="col-sm-10 offset-sm-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="gridCheck1" />
              <label class="form-check-label" for="gridCheck1"> Seni </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="gridCheck2" />
              <label class="form-check-label" for="gridCheck1">
                Bela Diri
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="gridCheck3" />
              <label class="form-check-label" for="gridCheck1"> Sains </label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-info" onclick="berhasil()">
            Tambahkan Pengguna
          </button>
        </div>
      </form>
    </div>

    <script>
      function berhasil() {
        document.title = "Berhasil!";
        alert("Data Pengguna Berhasil Ditambahkan!");
      }
    </script>
  </body>
</html>
